name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: cmd
        run: |
          echo OS: %OS%
          "%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe" /help | findstr /C:"C# 5"

      # build.cmd drives csc.exe from the runtime directory, which needs no
      # targeting pack and no SDK — the same reason it works on XP SP3.
      - name: Build (Release)
        shell: cmd
        run: build.cmd Release

      - name: Build (Debug)
        shell: cmd
        run: build.cmd Debug

      - name: Self-test
        shell: cmd
        run: |
          bin\Radiocity.exe selftest > selftest.log 2>&1
          type selftest.log
          if errorlevel 1 exit /b 1

      - name: Smoke test the CLI
        shell: cmd
        run: |
          bin\Radiocity.exe help
          if errorlevel 1 exit /b 1

      # The UI is plain JS in a single <script> block. Parsing it costs nothing
      # and catches the class of typo that would otherwise only show up as a
      # blank page in someone's browser.
      - name: Validate the UI script
        shell: powershell
        run: |
          $html = Get-Content web\index.html -Raw
          $m = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (-not $m.Success) { throw "no <script> block found in web/index.html" }
          $m.Groups[1].Value | Out-File -Encoding utf8 ui.js
          node --check ui.js
          if ($LASTEXITCODE -ne 0) { throw "UI script has a syntax error" }
          Write-Host "UI script parses"

      # Real integration test: start the server on the synthetic source and talk
      # to it over HTTP the way a browser would.
      - name: WebSDR integration test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Get-Process Radiocity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath "bin\Radiocity.exe" -ArgumentList "web","--sim","--port","8099","--rate","48000" -PassThru -WindowStyle Hidden -RedirectStandardOutput "web-test.log" -RedirectStandardError "web-test.err"

          try {
            # Readiness via a raw socket, not Invoke-WebRequest: on a machine
            # with proxy auto-detection the first HTTP request can take seconds
            # before it even reaches localhost, and that is not a server bug.
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $probe = New-Object System.Net.Sockets.TcpClient
                $probe.Connect("127.0.0.1", 8099)
                $probe.Close()
                $ok = $true
                break
              } catch { }
            }
            if (-not $ok) { throw "server did not open port 8099" }

            $state = $null
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $state = Invoke-RestMethod "http://localhost:8099/state" -TimeoutSec 10
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $state) { throw "GET /state never answered" }

            if ($state.rate -ne 48000) { throw "unexpected rate: $($state.rate)" }
            Write-Host "state: $($state | ConvertTo-Json -Compress)"

            $ui = Invoke-WebRequest "http://localhost:8099/" -UseBasicParsing -TimeoutSec 10
            if ($ui.Content -notmatch '<title>Radiocity</title>') { throw "UI did not serve the embedded page" }
            Write-Host "UI: $($ui.RawContentLength) bytes"

            $wf = Invoke-WebRequest "http://localhost:8099/waterfall?from=0" -UseBasicParsing -TimeoutSec 10
            if ($wf.RawContentLength -lt 256) { throw "waterfall returned no columns" }
            Write-Host "waterfall: $($wf.RawContentLength) bytes, next=$($wf.Headers['X-Next-From'])"

            $tuned = Invoke-RestMethod "http://localhost:8099/tune" -Method POST -Body "f=3000&mode=cw&bw=500" -TimeoutSec 10
            if ($tuned.freq -ne 3000) { throw "tune did not take effect" }
            if ($tuned.mode -ne "CW") { throw "mode switch did not take effect" }
            Write-Host "tuned: $($tuned | ConvertTo-Json -Compress)"

            # The blanker has to survive the round trip through the HTTP layer,
            # not just work as a class.
            $on = Invoke-RestMethod "http://localhost:8099/tune" -Method POST -Body "f=3000&mode=am&bw=6000&blank=12" -TimeoutSec 10
            if ($on.blank -ne 12) { throw "blanker did not switch on (got $($on.blank))" }
            $off = Invoke-RestMethod "http://localhost:8099/tune" -Method POST -Body "f=3000&mode=am&bw=6000&blank=0" -TimeoutSec 10
            if ($off.blank -ne 0) { throw "blanker did not switch off (got $($off.blank))" }
            Write-Host "blanker: on and off both accepted"

            # Two listeners must be able to sit on different frequencies at the
            # same time. This is the whole point of per-session receivers.
            $a = Invoke-RestMethod "http://localhost:8099/tune?sid=alpha" -Method POST -Body "f=3000&mode=am&bw=6000" -TimeoutSec 10
            $b = Invoke-RestMethod "http://localhost:8099/tune?sid=bravo" -Method POST -Body "f=18000&mode=am&bw=6000" -TimeoutSec 10
            $a2 = Invoke-RestMethod "http://localhost:8099/state?sid=alpha" -TimeoutSec 10
            $b2 = Invoke-RestMethod "http://localhost:8099/state?sid=bravo" -TimeoutSec 10
            if ($a2.freq -ne 3000) { throw "session alpha moved to $($a2.freq)" }
            if ($b2.freq -ne 18000) { throw "session bravo moved to $($b2.freq)" }
            if ($a2.sessions -lt 3) { throw "expected at least 3 sessions, got $($a2.sessions)" }
            Write-Host "independent tuning: alpha=$($a2.freq) Hz, bravo=$($b2.freq) Hz, $($a2.sessions) sessions"

            # A real source must report the band it can actually see.
            if ($state.quadrature -ne $false) { throw "a real source should not report quadrature" }
            if ($state.bandLo -ne 0) { throw "a real source should start at 0 Hz, got $($state.bandLo)" }
            Write-Host "real source: band 0..$($state.bandHi) Hz"

            # Audio must actually stream PCM, not just answer 200. Read against a
            # time budget rather than an iteration count: chunked responses
            # arrive in whatever sizes the server flushed.
            $client = New-Object System.Net.Sockets.TcpClient
            $client.Connect("127.0.0.1", 8099)
            $stream = $client.GetStream()
            $stream.ReadTimeout = 8000
            $req = [Text.Encoding]::ASCII.GetBytes("GET /audio?sid=bravo HTTP/1.1`r`nHost: localhost`r`n`r`n")
            $stream.Write($req, 0, $req.Length)

            $buffer = New-Object byte[] 8192
            $total = 0
            $deadline = (Get-Date).AddSeconds(8)
            while ((Get-Date) -lt $deadline -and $total -lt 16384) {
              $n = $stream.Read($buffer, 0, 8192)
              if ($n -le 0) { break }
              $total += $n
            }
            $client.Close()
            if ($total -lt 4096) { throw "audio stream delivered only $total bytes" }
            Write-Host "audio: $total bytes"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload web test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-log
          path: |
            web-test.log
            web-test.err
          if-no-files-found: ignore

      # The quadrature path is a different receiver: the band is centred on the
      # local oscillator, negative frequencies are real, and the image has to be
      # suppressed. Test it separately rather than assuming it shares code paths.
      - name: Quadrature integration test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Get-Process Radiocity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath "bin\Radiocity.exe" -ArgumentList "web","--sim-iq","--port","8098","--rate","48000" -PassThru -WindowStyle Hidden -RedirectStandardOutput "quad-test.log" -RedirectStandardError "quad-test.err"

          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $probe = New-Object System.Net.Sockets.TcpClient
                $probe.Connect("127.0.0.1", 8098)
                $probe.Close()
                $ok = $true
                break
              } catch { }
            }
            if (-not $ok) { throw "quadrature server did not open port 8098" }

            $state = $null
            for ($i = 0; $i -lt 20; $i++) {
              try { $state = Invoke-RestMethod "http://localhost:8098/state" -TimeoutSec 10; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if ($null -eq $state) { throw "GET /state never answered" }

            if ($state.quadrature -ne $true) { throw "quadrature source did not report quadrature" }
            if ($state.bandLo -ne -24000) { throw "expected band to start at -24000, got $($state.bandLo)" }
            Write-Host "band: $($state.bandLo)..$($state.bandHi) Hz around the LO"

            # Tuning to a negative frequency must work, and must land there.
            $neg = Invoke-RestMethod "http://localhost:8098/tune?sid=neg" -Method POST -Body "f=-12000&mode=am&bw=6000" -TimeoutSec 10
            if ($neg.freq -ne -12000) { throw "negative tuning clamped to $($neg.freq)" }
            Write-Host "negative tuning: $($neg.freq) Hz"

            # The synthetic front end has a 2% gain error and 3 degrees of phase
            # error, so the image at -12 kHz is real. Correction must suppress it.
            Start-Sleep -Seconds 2
            $image = (Invoke-RestMethod "http://localhost:8098/state?sid=neg" -TimeoutSec 10).level
            $want = (Invoke-RestMethod "http://localhost:8098/tune?sid=want" -Method POST -Body "f=12000&mode=am&bw=6000" -TimeoutSec 10).level
            Start-Sleep -Seconds 2
            $want = (Invoke-RestMethod "http://localhost:8098/state?sid=want" -TimeoutSec 10).level

            Write-Host "wanted +12 kHz: $want dBFS, image -12 kHz: $image dBFS"
            if ($want -lt -30) { throw "wanted carrier is too weak: $want dBFS" }
            if ($image -gt -40) { throw "image is not suppressed: $image dBFS" }
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload quadrature test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quad-test-log
          path: |
            quad-test.log
            quad-test.err
          if-no-files-found: ignore

      # The icon is generated, not hand-edited. Rather than compare bytes —
      # GDI+ antialiasing differs between Windows versions, so a hash check
      # would fail for reasons outside anyone's control — parse the file and
      # prove it is a well-formed multi-size ICO.
      - name: Validate the icon
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("assets\radiocity.ico")
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0) { throw "bad ICO reserved field" }
          if ($bytes[2] -ne 1 -or $bytes[3] -ne 0) { throw "not an icon (type != 1)" }

          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($count -lt 1) { throw "no icon entries" }

          $sizes = @()
          for ($i = 0; $i -lt $count; $i++) {
            $o = 6 + 16 * $i
            $w = if ($bytes[$o] -eq 0) { 256 } else { $bytes[$o] }
            $bpp = [BitConverter]::ToUInt16($bytes, $o + 6)
            $len = [BitConverter]::ToUInt32($bytes, $o + 8)
            $off = [BitConverter]::ToUInt32($bytes, $o + 12)
            if ($off + $len -gt $bytes.Length) { throw "entry $i points past the end of the file" }
            if ($bpp -ne 32) { throw "entry $i is $bpp bpp, expected 32" }
            $sizes += $w
          }

          if ($sizes -notcontains 16)  { throw "missing 16x16" }
          if ($sizes -notcontains 32)  { throw "missing 32x32" }
          if ($sizes -notcontains 128) { throw "missing 128x128" }
          Write-Host "ICO OK: $count entries, sizes $($sizes -join ', ')"

      - name: Package artefacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item bin\Radiocity.exe dist\
          Copy-Item README.md, LICENSE dist\
          New-Item -ItemType Directory -Path dist\assets | Out-Null
          Copy-Item assets\radiocity.ico, assets\radiocity.png dist\assets\

          $sha = (Get-FileHash dist\Radiocity.exe -Algorithm SHA256).Hash
          "$sha  Radiocity.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt

          $size = (Get-Item dist\Radiocity.exe).Length
          Write-Host "Radiocity.exe: $size bytes"
          Write-Host "sha256: $sha"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Radiocity-win-anycpu
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log
          if-no-files-found: ignore

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: Radiocity-win-anycpu
          path: dist

      - name: Zip it
        shell: powershell
        run: Compress-Archive -Path dist\* -DestinationPath "Radiocity-${{ github.ref_name }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Radiocity-${{ github.ref_name }}.zip
          generate_release_notes: true
